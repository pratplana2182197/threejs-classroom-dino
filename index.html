<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Three.js Classroom Dino</title>
    <link rel="shortcut icon" type="image/png" href="/dino.png"/>
  </head>
  <body>
    <div id="loading-overlay">
      <div class="spinner">
    <img id="spinner-img" src="/dino_white.png" alt="Loading..." />
  </div>
      <p>Loading game, please wait...</p>
    </div>
    <div id="teleportPrompt" style="
      position: fixed;
      bottom: 30px;
      width: 100%;
      text-align: center;
      font-size: 20px;
      color: white;
      font-family: monospace;
      text-shadow: 0 0 4px black;
      display: none;
      pointer-events: none;
      z-index: 10;
    ">
    Press E to enter the game
    </div>
    <div id="stats-box"></div>
    <script type="module" src="/src/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stats.js/build/stats.min.js"></script>

  </body>
</html>
